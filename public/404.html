<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Plate Atlas</title>
    <script>
      // redirect unknown GitHub Pages routes back through index.html so the SPA router can restore them
      ;(() => {
        const { pathname, search, hash } = window.location
        const repoBase = '/plate-atlas'
        const routeSegments = (pathname.startsWith(repoBase) ? pathname.slice(repoBase.length) : pathname)
          .split('/')
          .filter(Boolean)
        const normalizedRoute = routeSegments.length ? `/${routeSegments.join('/')}` : '/'
        const normalizedSearch = search ? `&${search.slice(1).replace(/&/g, '~and~')}` : ''
        const nextUrl = `${repoBase}/?${normalizedRoute}${normalizedSearch}${hash}`

        window.location.replace(nextUrl)
      })()
    </script>
  </head>
  <body></body>
</html>
